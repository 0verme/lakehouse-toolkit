---
# 公开示例：connection 只使用 demo 占位值；真实值请仅写入被忽略的
# configs/lineage_providers.local.yaml。CI / Docker 场景可使用 connection_env。
# 每个 profile 选择一种连接来源：connection、connection_env 或 legacy 顶层 *_env。

mysql_process_profiles:
  # 内网 Windows 人工执行可在 local 配置中使用 connection，减少环境变量数量。
  - name: mysql_dev_a
    environment: DEV
    connection:
      host: 127.0.0.1
      port: 3306
      user: DEMO_USER
      password: DEMO_PASSWORD_VALUE
      database: demo_meta
    table: demo_meta.processes
    program_name_column: process_name
    script_code_column: script_code
    # demo_meta.processes 没有固定的 expected target 字段；不填即为 None。
    expected_target_column: null
    # 只有完成历史格式核验后才启用程序名 target hint。
    # primary_target_strategy: program_name
    # program_name_target_prefix: DEMO_
    primary_target_strategy: explicit
    program_name_target_prefix: null
    batch_size: 200

  # CI / Docker 可只提交环境变量名，连接值仍由运行环境注入。
  - name: mysql_dev_b
    environment: DEV
    connection_env:
      host: LAKEHOUSE_DEV_B_MYSQL_HOST
      port: LAKEHOUSE_DEV_B_MYSQL_PORT
      user: LAKEHOUSE_DEV_B_MYSQL_USER
      password: LAKEHOUSE_DEV_B_MYSQL_PASSWORD
      database: LAKEHOUSE_DEV_B_MYSQL_DATABASE
    table: demo_meta.processes
    program_name_column: process_name
    script_code_column: script_code
    expected_target_column: null
    primary_target_strategy: explicit
    program_name_target_prefix: null
    batch_size: 200

  # 兼容现有 legacy 顶层 host_env / port_env / user_env / password_env /
  # database_env；迁移时无需一次性修改所有 profile。
  - name: mysql_dev_legacy
    environment: DEV
    host_env: LAKEHOUSE_DEV_LEGACY_MYSQL_HOST
    port_env: LAKEHOUSE_DEV_LEGACY_MYSQL_PORT
    user_env: LAKEHOUSE_DEV_LEGACY_MYSQL_USER
    password_env: LAKEHOUSE_DEV_LEGACY_MYSQL_PASSWORD
    database_env: LAKEHOUSE_DEV_LEGACY_MYSQL_DATABASE
    table: demo_meta.processes
    program_name_column: process_name
    script_code_column: script_code
    expected_target_column: null
    primary_target_strategy: explicit
    program_name_target_prefix: null
    batch_size: 200

# profile 数量没有固定上限；真实部署可按 1..N 增删上述项。
production:
  environment: PROD
  source_profile: production_metadata

# Local SVN working-copy inventory；真实 root_path 只写入
# configs/lineage_providers.local.yaml，不提交真实内网 SVN 路径。
# root_path 是当前机器可访问的本地 working copy 根目录，不是 svn:// 或 HTTP SVN URL。
# processing 与 dwf 可以共享同一个 root；layout 决定扫描规则。
# Windows / Linux 只需按运行 verify_svn_sources 或 imp_lineage_edge 的机器修改
# root_path；imp_lineage_edge 的 generic loader 会将每个 profile 独立实例化为
# SVNProgramSourceProvider。
svn_profiles:
  - name: prod_svn_processing
    environment: PROD
    root_path: "E:/demo/svn/production"
    layout: processing

  - name: prod_svn_dwf
    environment: PROD
    root_path: "E:/demo/svn/production"
    layout: dwf
